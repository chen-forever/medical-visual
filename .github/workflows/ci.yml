name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend
        run: npm --prefix app ci --no-audit --no-fund

      - name: Typecheck
        run: npm --prefix app run typecheck

      - name: Build frontend
        run: npm --prefix app run build

      - name: Server tests
        run: npm --prefix server test

      - name: Verify model assets
        run: node server/verify-assets.mjs
